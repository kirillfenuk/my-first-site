    <!-- Современное событие addEventListener -->
    <script>
        let buttonFirst = document.getElementById('button-first')

        buttonFirst.addEventListener('click', () => {
            alert('Спасибо что нажали на меня, я удаляюсь')
            buttonFirst.style.display = 'none'
        })
    </script>

    <!-- Самый короткий вариант -->
    <script>
        document.getElementById('button-first').addEventListener('click', () => {
            alert('Спасибо что нажали на меня, я удаляюсь')
            buttonFirst.style.display = 'none'
        })
    </script>

    <!-- ================ Другие основные HTML-атрибуты событий ================ -->
    <!--


   onclick – обычный клик
   ondblclick – двойной клик


   ondrag – когда перенёс на объект что-то и вызывается функция
   ondragend – когда перетаскивал что-то мышкой, и перестал перетаскивать


   onfocus – когда что-то становится активным (в фокусе), например поле ввода для input
   onblur – потеря фокуса (когда вышел из фокуса из input например)


   onmouseover или onmouseenter – навели мышку
   onmouseout или onmouseleave – убрали мышку


   onload – что-то происходит когда страница полностью загружена (часто применяют к <body>)


   onmousedown – когда нажал на мышку и держишь её
   onmouseup – когда нажал на мышку и отпустил и в момент отпускания что-то произойдёт
   oncontextmenu – когда нажал ПКМ по объекту


-->
