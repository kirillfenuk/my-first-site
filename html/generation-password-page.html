<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Базовые стили для страницы -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            margin: 0;
        }


        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }


        h1 {
            margin-bottom: 20px;
        }


        label {
            display: block;
            margin-top: 10px;
        }


        input,
        select {
            padding: 10px;
            margin-top: 5px;
            width: 100%;
            box-sizing: border-box;
        }


        button {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }


        button:hover {
            background-color: #0056b3;
        }


        .output {
            margin-top: 20px;
        }


        #password {
            font-size: 1.2em;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Генератор паролей</h1>
        <label for="length">Длина</label>
        <input type="number" id="length" min="1" max="100" value="10">


        <label for="language">Язык</label>
        <select id="language">
            <option value="en">English</option>
            <option value="ru">Russian</option>
        </select>


        <label for="complexity">Сложность</label>
        <select id="complexity">
            <option value="simple">Простой</option>
            <option value="medium">Средний</option>
            <option value="complex">Высокий</option>
        </select>


        <button id="generate">Сгенерировать</button>


        <div class="output">
            <h2>Ваш пароль:</h2>
            <p id="password"></p>
            <p id="result"></p>
        </div>
    </div>



    <script>
        document.getElementById('generate').addEventListener('click', () => {
            // Получаем значение длины пароля из input с id 'length', преобразуем в число
            const length = Number(document.getElementById('length').value)

            // Получаем выбранный язык из select с id 'lenguage' (например: 'en' или 'ru')
            const language = document.getElementById('language').value

            // получаем уровень сложности из select c id 'complexity' (например: 'simple', 'medium', 'hard')
            const complexity = document.getElementById('complexity').value

            // Объявляем переменную для хранения сгенерированных символов
            let charset = ''


            // Устанавливаем набор символов в зависимости от выбранного языка и сложности
            // Английский язык
            if (language === 'en') {
                // Простая сложность: только буквы (заглавные и строчные)
                if (complexity === 'simple') {
                    charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'

                    // Средняя сложность: буквы + цифры
                } else if (complexity === 'medium') {
                    charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'

                    // Высокая сложность: буквы + цифры + специальные символы
                } else {
                    charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|:,.<>?'
                }


                // Русский язык
            } else if (language === 'ru') {
                // Простая сложность: только буквы (заглавные и строчные)
                if (complexity === 'simple') {
                    charset = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя'

                    // Средняя сложность: буквы + цифры
                } else if (complexity === 'medium') {
                    charset = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789'

                    // Высокая сложность: буквы + цифры + специальные символы
                } else {
                    charset = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789!@#$%^&*()_+[]{}|:,.<>?'
                }
            }


            // Создаём пустую строку для будущего пороля
            let password = ''
            let i = 0


            // Генерируем символы случайным образом из charset до достижения нужной длины
            while (i < length) {
                const randomIndex = Math.floor(Math.random() * charset.length)
                password += charset[randomIndex] // Добавляем символ в пароль
                i++
            }

            // Выводим сгенерированный пароль в элемент с id 'password'
            document.getElementById('result').textContent = password


        })
    </script>

</body>


</html>
