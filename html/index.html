<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            align-items: center;
            background-color: rgb(37, 37, 37);
            color: white;
        }

        button{

        }
    </style>
</head>

<body>

    <!-- Скрипт можно писать прямо в HTML через тег script -->

        let myH = document.querySelector('h1')

        p.style.color = 'white'
