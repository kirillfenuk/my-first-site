      <p>Первый текст</p>
      <p>Второй текст</p>
      <p>Третий текст</p>
      <button id="btnSize">Увеличивает размер всем параграфам</button>


      <script>
        let allP = document.querySelectorAll('p')

        // При нажатии на кнопку
        document.getElementById('btnSize').addEventListener('click', () => {
            // Переебираем все P через for
            for (let i = 0; i < allP.length; i++) {
                allP[i].style.fontSize = '32px'
            }
            
            // Перебираем все P через for .. of
            for (const e of allP) {
                e.style.fontSize = '32px'
            }


            // Или перебираем все P через forEach
            allP.forEach(e => {e.style.fontSize = '32px'})
        })
      </script>




      <div class="block">Просто текст в блоке</div>

      <script>
        let div = document.querySelector('.block')
        
        function changeText() {
            div.textContent = 'Другой текст'
        }
        div.addEventListener('click', changeText)
        
        div.addEventListener('mouseout', () => {
            div.textContent = 'Это тоже другой'
        })
      </script>
