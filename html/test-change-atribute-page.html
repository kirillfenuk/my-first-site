    <!-- 
        если у input есть placeholder – заменить его текст
        если нет – добавить новый
        вывести результат проверки в консоль
    -->

    <input type="text">
    <button>Изменить placeholder</button>

    <script>
        let input = document.querySelector('input')
        let btn = document.querySelector('button')

        btn.addEventListener('click', () => {
            if (input.hasAttribute('placeholder')) {
                input.placeholder = 'Текст изменён'
                console.log('Текст изменён');
                
            } else {
                input.setAttribute('placeholder', 'Новый текст')
                console.log('placeholder добавлен');
            }
        })

    </script>
