    <!-- textContent - вставка текста в HTML через JS -->
    <script>
        let a = 5
        let b = 3
        let sum = a + b

        const result = document.getElementById('result') // то куда вставляем результат
        const result3 = document.getElementById('result3')

        result.textContent = `Результат: ${sum}` // textContent - для вставки только текста
        result3.textContent = sum

        // Или в некоторых случаях можно писать сокращенно (тоже будет работать)
        // document.getElementById('result').textContent = `Результат: ${sum}` // Сокращенная запись
    </script>

    <!-- ============== Изменение стилей элементов ==================== -->
    <h2 id="title">Текст который меняет цвет при старте сайта</h2>
    <script>
        const title = document.getElementById('title')
        // console.log(document.getElementById('title')); // Проверка на существование элемента


        title.style.color = 'blue' // Меняем этому элементу style.color
        title.style.backgroundColor = 'gray' // Слитно пишем CSS если там > 1 слова
        title.style.padding = '20px'
        title.style.textAlign = 'center'
        title.textContent = 'Hello world'
    </script>

    <!-- Другие популярные обращения к элементам -->
     <script>
        console.log(document.documentElement) // Обращение к html тегу (который в самом вверху)
        console.log(document.head) // Обращение на прямую к тегу head или body можно и т.д.
        console.log(document.getElementsByTagName('body')) // Обращение к тегу body
     </script>



     <!-- querySelector самый уневерсальный способ -->
      <script>
        console.log(document.querySelector('h2')) // по тегу 
        console.log(document.querySelector('#first')) // по id
        console.log(document.querySelector('.some-class')) // по классу
