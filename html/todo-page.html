<!DOCTYPE html>
<html lang="ru">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список дел – главная</title>
</head>


<body>


    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #242424;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }


        .container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }


        input[type="text"] {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }


        button {
            padding: 10px 15px;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }


        button:hover {
            background-color: #218838;
        }


        ul {
            list-style: none;
            padding: 0;
        }


        li {
            background: #f9f9f9;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        li button {
            background: tomato;
            border: none;
            padding: 5px 10px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }


        li button:hover {
            background: #c82333;
        }
    </style>

    <!-- HTML -->
    <div class="container">
        <h1>Список дел</h1>
        <input type="text" id="input-task" placeholder="Напиши задачу...">
        <button id="button-add-task">Добавить</button>
        <ul id="ul-task-list"></ul>
    </div>

    <!-- JS -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || []

        let buttonAddTask = document.getElementById('button-add-task')
        
        /* Добавляет задачу при нажатии на кнопку */
        buttonAddTask.addEventListener('click', () => {
            const inputTask = document.getElementById('input-task')

            tasks.push(inputTask.value)
            renderTasks()

            if (inputTask.value != '') {
                localStorage.setItem('tasks', JSON.stringify(tasks))
                inputTask.value = ''
                renderTasks()
            }
        })

        /* Вывод задач из массива в приложение */

        function renderTasks() {
            let ulTaskList = document.getElementById('ul-task-list')
            ulTaskList.innerHTML = ''
            
            
            tasks.forEach((taskText, i) => {
                // пункт задачи
                let li = document.createElement('li')
                li.textContent = taskText
                ulTaskList.appendChild(li)

                // кнопка корзины
                let deleteBtn = document.createElement('button')
                deleteBtn.textContent = '🗑️'
                li.append(deleteBtn)
                deleteBtn.addEventListener('click', () => {
                    tasks.splice(i, 1)
                    localStorage.setItem('tasks', JSON.stringify(tasks))
                    renderTasks()
                })

            })

        }

        renderTasks()

    </script>


</body>

</html>
